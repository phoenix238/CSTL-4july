name: Payment poll

# Checks the bank for new payments every 15 minutes so a transfer is marked
# paid soon after it settles, instead of waiting for the once-a-day Vercel cron
# (the Hobby plan's only scheduled slot, spent on /api/payments/cron).
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET (the
# same value as the Vercel env var of that name). GitHub's scheduled runs can
# lag by a few minutes and are paused after 60 days without repo activity.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check the bank for new payments
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/payments/poll"
